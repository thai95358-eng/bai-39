<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - HUYNH ANH THAI - 231A011025</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 420px;
        }
        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }
        h2 {
            margin: 10px 0 5px 0;
            color: #333;
        }
        p {
            color: #666;
            margin: 5px 0 20px 0;
            font-weight: bold;
        }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-links a, .menu-links button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-family: Arial, sans-serif;
        }
        .menu-links a:hover, .menu-links button:hover {
            background-color: #0056b3;
        }

        /* Giao diện khung Modal hiển thị ảnh kết quả Bài 38 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            max-height: 80%;
            text-align: center;
            position: relative;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 6px;
            border: 2px solid #ddd;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #f00;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="images/avatar.jpg" alt="Ảnh sinh viên">
        <h2>HUYNH ANH THAI</h2>
        <p>Mã sinh viên: 231A011025</p>
        
        <div class="menu-links">
            <!-- Nút bấm hiển thị ảnh kết quả Bài 38 từ thư mục images -->
            <button onclick="openModal()">Bài tập 38 (Xem Hình Kết Quả)</button>
            <a href="den-keo-quan.html" target="_blank">Bài tập 39 (Đèn Kéo Quân)</a>
        </div>
    </div>

    <!-- Khung Modal chứa ảnh -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Kết quả Bài tập 38</h3>
            <img src="images/ketquabai38.jpg" alt="Kết quả Bài tập 38">
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Đóng modal khi bấm ra ngoài vùng ảnh
        window.onclick = function(event) {
            let modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>

</body>
</html>
